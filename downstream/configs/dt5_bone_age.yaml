# DT5 -- bone-age regression (RSNA; n = 12,611).
# Frozen encoder + linear head on the globally pooled representation, mean squared error on the
# standardized target; reported metric: test mean absolute error in months (patient-level 5-fold CV).
# Manifest: python -m downstream.prepare_manifests bone-age --csv <boneage-training-dataset.csv> --images <boneage-training-dataset> --out data/downstream/dt5_bone_age.csv

task: DT5
name: bone_age
type: regression
manifest: data/downstream/dt5_bone_age.csv
metric: mae_months
image_size: 224
n_folds: 5
val_fraction: 0.15
seed: 123
num_workers: 8
search:
  n_trials: 10
  lr: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
  batch_size: [16, 32, 64]
  weight_decay: [0.0, 1.0e-5, 1.0e-4]
training:
  max_epochs: 60
  patience: 15
  checkpoint_metric: val_loss

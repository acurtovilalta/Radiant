# C4 -- SliceRADIANT: is the learned 3D projection bridge needed?
# Full RADIANT (radiant/resnet50_scratch.yaml) with the 3D ResNet-34 + projection bridge replaced by a separate
# 2D ResNet-34 over n = 8 evenly spaced slices per volume (central 50% of the slice axis,
# per-slice z-score, X-ray crops 2x224 + 2x96; all 8 slices of a view share one crop/augmentation draw).
# The 8 slice embeddings (same 2D projection head) form the MIL bag in place of the 8 projections; the mean
# slice feature is the volume embedding for MRI SwAV. L_div is dropped (no depth attention). Like RADIANT's 3D
# encoder, the 2D slice encoder is initialised by Models Genesis pretraining (50 epochs) on the same slices; run it once:
#     python pretrain_mri.py --config configs/mri_pretraining/slice_encoder_genesis.yaml
# Every other objective, loss weight, hyperparameter and the schedule (20 warm-up + 46 joint epochs) are unchanged.
#
# Downstream evaluation uses checkpoints/final.pt (the final epoch; no checkpoint selection).
# Launch (2 GPUs, DDP; per-GPU batch sizes below):
#     torchrun --nproc_per_node=2 train.py --config configs/controls/c4_slice_radiant.yaml
# Paths are relative to the repository root; see README.md (Data) for the manifest format.

seed: 13
output_dir: outputs/controls/c4_slice_radiant
use_amp: true
log_every_steps: 20
val_every_epochs: 4
log_bridge_gradient_audit: true
bridge_gradient_audit_every_steps: 100
xray_data:
  manifest_path: data/manifests/xray_manifest.csv
  path_column: file_path_processed
  split_group_column: patient_id
  split: train
  batch_size: 32
  num_workers: 12
  shuffle: true
  drop_last: false
  pin_memory: true
  val_fraction: 0.05
  split_seed: 42
  shared_family_batching: true
  families_per_batch: 4
  global_crop_size: 224
  local_crop_size: 96
  num_local_crops: 2
  anatomy_column: coarse_anatomy
  view_column: view_or_plane
mri_data:
  manifest_path: data/manifests/mri_manifest.csv
  path_column: file_path_processed
  split_group_column: patient_id
  split: train
  batch_size: 16
  num_workers: 8
  shuffle: true
  drop_last: false
  pin_memory: true
  val_fraction: 0.05
  split_seed: 42
  shared_family_batching: true
  families_per_batch: 4
  global_crop_size: 224
  local_crop_size: 96
  num_local_crops: 2
  anatomy_column: anatomy
  slice_mode: evenly_spaced
  num_slices: 8
  slice_central_fraction: 0.5
xray_model:
  backbone: resnet50
  in_channels: 1
  pretrained: false
  embedding_dim: 256
  projector_hidden_dim: 1024
  projector_layers: 2
mri_model:
  backbone: resnet34
  in_channels: 1
  base_channels: 32
  embedding_dim: 256
  projector_hidden_dim: 512
  projector_layers: 2
  encoder_type: slice_2d
  use_mri_projection_bridge: true
  mri_projection_num_projections: 8
  mri_projection_embedding_dim: 256
  mri_projection_attention_temperature: 0.5
  stage_stride_schedule: half_depth
  pretrained_checkpoint: outputs/mri_pretraining_slice2d/checkpoint_latest.pt
prototype_banks:
  embedding_dim: 256
  prototypes_per_family: 96
  normalize_prototypes: true
xray_assignment:
  sinkhorn_epsilon: 0.03
  sinkhorn_iterations: 20
  use_feature_queue: false
  queue_size: 0
  queue_start_steps: 0
mri_assignment:
  sinkhorn_epsilon: 0.03
  sinkhorn_iterations: 20
  use_feature_queue: true
  queue_size: 128
  queue_start_steps: 100
xray_swav_loss:
  temperature: 0.1
  num_assignment_crops: 2
mri_swav_loss:
  temperature: 0.1
  num_assignment_crops: 2
schedule:
  warm_start_epochs: 20
  joint_epochs: 46
  cross_modal_ramp_epochs: 10
optimizer:
  lr: 0.000448
  weight_decay: 0.00000407
  betas: [0.9, 0.999]
  eps: 1.0e-08
  grad_clip_norm: 0.5
  min_lr_ratio: 0.12828007938486083
  warmup_epochs: 3
checkpoint:
  output_dir: outputs/controls/c4_slice_radiant/checkpoints
  save_every_epochs: 4
  keep_last_only: false
  resume_path: null
wandb:
  enabled: true
  project: radiant
  run_name: controls_c4_slice_radiant
  group: controls
  tags: [controls, C4, resnet50, scratch]
distributed:
  enabled: true
  backend: nccl
lambda_xray_view: 0.10396062728888134
lambda_centroid_alignment: 3.8660555529724485
centroid_alignment:
  normalize_centroids: true
  min_prototype_mass: 0.0001
  distance: mse
lambda_projection_mil_contrastive: 0.03695519382684474
projection_mil_temperature: 0.07
lambda_projection_attention_diversity: 0.0
runtime:
  cudnn_enabled: true
  cudnn_benchmark: true
  cudnn_deterministic: false
  allow_cudnn_fallback_on_init_error: true
ablations:
  prototype_scope: anatomy_specific
devices:
  xray: null
  mri: null
  output: null

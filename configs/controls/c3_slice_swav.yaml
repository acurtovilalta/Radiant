# C3 -- SliceSwAV: is a dedicated 3D MRI branch needed at all?
# radiant/resnet50_scratch.yaml with ONE shared 2D encoder: each MRI volume gives 1 random
# slice per step (central 50% of the slice axis, per-slice z-score, X-ray crops 2x224 + 2x96 and
# augmentations), encoded by the X-ray backbone, projector and prototype banks (MRI keeps its own Sinkhorn).
# Losses: X-ray SwAV + X-ray view + slice SwAV, the MRI loss weighted by lambda_mri_loss = 0.25 (at 1.0 the
# slices dominate the shared encoder and X-ray learning stalls). No 3D encoder, bridge, MIL or centroid
# alignment. It has no cross-modal objective, so optimizer and X-ray view weight are RADIANT-X's
# (radiant_x/resnet50_scratch.yaml); the schedule (20 warm-up + 46 joint epochs) is RADIANT's.
# lambda_mri_loss is the only additional tuned hyperparameter.
#
# Downstream evaluation uses checkpoints/final.pt (the final epoch; no checkpoint selection).
# Launch (2 GPUs, DDP; per-GPU batch sizes below):
#     torchrun --nproc_per_node=2 train.py --config configs/controls/c3_slice_swav.yaml
# Paths are relative to the repository root; see README.md (Data) for the manifest format.

seed: 13
output_dir: outputs/controls/c3_slice_swav
use_amp: true
log_every_steps: 20
val_every_epochs: 4
log_bridge_gradient_audit: false
bridge_gradient_audit_every_steps: 100
xray_data:
  manifest_path: data/manifests/xray_manifest.csv
  path_column: file_path_processed
  split_group_column: patient_id
  split: train
  batch_size: 32
  num_workers: 12
  shuffle: true
  drop_last: false
  pin_memory: true
  val_fraction: 0.05
  split_seed: 42
  shared_family_batching: true
  families_per_batch: 4
  global_crop_size: 224
  local_crop_size: 96
  num_local_crops: 2
  anatomy_column: coarse_anatomy
  view_column: view_or_plane
mri_data:
  manifest_path: data/manifests/mri_manifest.csv
  path_column: file_path_processed
  split_group_column: patient_id
  split: train
  batch_size: 16
  num_workers: 8
  shuffle: true
  drop_last: false
  pin_memory: true
  val_fraction: 0.05
  split_seed: 42
  shared_family_batching: true
  families_per_batch: 4
  global_crop_size: 224
  local_crop_size: 96
  num_local_crops: 2
  anatomy_column: anatomy
  slice_mode: random
  num_slices: 1
  slice_central_fraction: 0.5
xray_model:
  backbone: resnet50
  in_channels: 1
  pretrained: false
  embedding_dim: 256
  projector_hidden_dim: 1024
  projector_layers: 2
mri_model:
  backbone: resnet34
  in_channels: 1
  base_channels: 32
  embedding_dim: 256
  projector_hidden_dim: 512
  projector_layers: 2
  encoder_type: shared_xray
  use_mri_projection_bridge: false
  mri_projection_num_projections: 8
  mri_projection_embedding_dim: 256
  mri_projection_attention_temperature: 0.5
  stage_stride_schedule: half_depth
  pretrained_checkpoint: null
prototype_banks:
  embedding_dim: 256
  prototypes_per_family: 96
  normalize_prototypes: true
xray_assignment:
  sinkhorn_epsilon: 0.03
  sinkhorn_iterations: 20
  use_feature_queue: false
  queue_size: 0
  queue_start_steps: 0
mri_assignment:
  sinkhorn_epsilon: 0.03
  sinkhorn_iterations: 20
  use_feature_queue: true
  queue_size: 128
  queue_start_steps: 100
xray_swav_loss:
  temperature: 0.1
  num_assignment_crops: 2
mri_swav_loss:
  temperature: 0.1
  num_assignment_crops: 2
schedule:
  warm_start_epochs: 20
  joint_epochs: 46
  cross_modal_ramp_epochs: 10
optimizer:
  lr: 0.000835
  weight_decay: 0.00001658
  betas: [0.9, 0.999]
  eps: 1.0e-08
  grad_clip_norm: 0.5
  min_lr_ratio: 0.11249953268155546
  warmup_epochs: 3
checkpoint:
  output_dir: outputs/controls/c3_slice_swav/checkpoints
  save_every_epochs: 4
  keep_last_only: false
  resume_path: null
wandb:
  enabled: true
  project: radiant
  run_name: controls_c3_slice_swav
  group: controls
  tags: [controls, C3, resnet50, scratch]
distributed:
  enabled: true
  backend: nccl
lambda_xray_view: 0.20505546674799544
lambda_centroid_alignment: 0.0
centroid_alignment:
  normalize_centroids: true
  min_prototype_mass: 0.0001
  distance: mse
lambda_projection_mil_contrastive: 0.0
projection_mil_temperature: 0.07
lambda_projection_attention_diversity: 0.0
lambda_mri_loss: 0.25
runtime:
  cudnn_enabled: true
  cudnn_benchmark: true
  cudnn_deterministic: false
  allow_cudnn_fallback_on_init_error: true
ablations:
  prototype_scope: anatomy_specific
devices:
  xray: null
  mri: null
  output: null

# Models Genesis restoration pretraining of the 3D MRI encoder (ResNet34-3D).
# Produces outputs/mri_pretraining/checkpoint_latest.pt, which every RADIANT config loads via
# mri_model.pretrained_checkpoint. The SwAV appearance augmentations are switched off here: the
# model reconstructs the clean crop from its own corrupted copy (see the `genesis` block).
# mri_data / mri_model must match the RADIANT configs (stage_stride_schedule: half_depth).
#
#     python pretrain_mri.py --config configs/mri_pretraining/mri_encoder_genesis.yaml

seed: 13
epochs: 50
output_dir: outputs/mri_pretraining
wandb_project: radiant
wandb_run_name: mri_pretraining
num_visual_examples: 10
log_every_steps: 20
use_amp: true
mri_data:
  manifest_path: data/manifests/mri_manifest.csv
  path_column: file_path_processed
  split_group_column: patient_id
  split: train
  batch_size: 16
  num_workers: 16
  shuffle: true
  drop_last: false
  pin_memory: true
  val_fraction: 0.05
  split_seed: 42
  shared_family_batching: true
  families_per_batch: 4
  global_crop_size: [32, 192, 192]
  local_crop_size: [32, 128, 128]
  num_local_crops: 0
  anatomy_column: anatomy
  augmentations:
    num_global_crops: 1
    intensity_scale_prob: 0.0
    intensity_shift_prob: 0.0
    contrast_prob: 0.0
    gaussian_noise_prob: 0.0
    gaussian_smooth_prob: 0.0
    affine_prob: 0.0
mri_model:
  backbone: resnet34
  in_channels: 1
  base_channels: 32
  embedding_dim: 256
  projector_hidden_dim: 512
  projector_layers: 2
  use_mri_projection_bridge: true
  mri_projection_num_projections: 8
  mri_projection_embedding_dim: 256
  mri_projection_attention_temperature: 0.5
  stage_stride_schedule: half_depth
optimizer:
  lr: 0.0003
  weight_decay: 1.0e-05
  betas: [0.9, 0.999]
  eps: 1.0e-08
  grad_clip_norm: 1.0
  min_lr_ratio: 0.1
  warmup_epochs: 1
genesis:
  nonlinear_prob: 0.9
  nonlinear_control_points: 4
  local_shuffle_prob: 0.5
  local_shuffle_num_windows: 200
  local_shuffle_max_window_size: 8
  inpaint_prob: 0.5
  inpaint_num_cuboids: 5
  inpaint_size_range: [0.1, 0.2]
  outpaint_prob: 0.2
  outpaint_keep_size_range: [0.6, 0.8]

# RADIANT -- ViT-B/16 X-ray encoder (DINOv3 architecture), random init.
# X-ray + MRI, 20 warm-up + 46 joint epochs (66 total).
#
# Downstream evaluation uses checkpoints/final.pt (the final epoch; no checkpoint selection).
# Launch (2 GPUs, DDP; per-GPU batch sizes below):
#     torchrun --nproc_per_node=2 train.py --config configs/radiant/vitb16_scratch.yaml
# Paths are relative to the repository root; see README.md (Data) for the manifest format.

seed: 13
output_dir: outputs/radiant/vitb16_scratch
use_amp: true
log_every_steps: 20
val_every_epochs: 4
log_bridge_gradient_audit: true
bridge_gradient_audit_every_steps: 100
xray_data:
  manifest_path: data/manifests/xray_manifest.csv
  path_column: file_path_processed
  split_group_column: patient_id
  split: train
  batch_size: 32
  num_workers: 12
  shuffle: true
  drop_last: false
  pin_memory: true
  val_fraction: 0.05
  split_seed: 42
  shared_family_batching: true
  families_per_batch: 4
  global_crop_size: 224
  local_crop_size: 96
  num_local_crops: 2
  anatomy_column: coarse_anatomy
  view_column: view_or_plane
mri_data:
  manifest_path: data/manifests/mri_manifest.csv
  path_column: file_path_processed
  split_group_column: patient_id
  split: train
  batch_size: 16
  num_workers: 8
  shuffle: true
  drop_last: false
  pin_memory: true
  val_fraction: 0.05
  split_seed: 42
  shared_family_batching: true
  families_per_batch: 4
  global_crop_size: [32, 192, 192]
  local_crop_size: [32, 128, 128]
  num_local_crops: 2
  anatomy_column: anatomy
xray_model:
  backbone: dinov3_vitb16
  in_channels: 1
  pretrained: false
  embedding_dim: 256
  projector_hidden_dim: 1024
  projector_layers: 2
mri_model:
  backbone: resnet34
  in_channels: 1
  base_channels: 32
  embedding_dim: 256
  projector_hidden_dim: 512
  projector_layers: 2
  use_mri_projection_bridge: true
  mri_projection_num_projections: 8
  mri_projection_embedding_dim: 256
  mri_projection_attention_temperature: 0.5
  stage_stride_schedule: half_depth
  pretrained_checkpoint: outputs/mri_pretraining/checkpoint_latest.pt
prototype_banks:
  embedding_dim: 256
  prototypes_per_family: 96
  normalize_prototypes: true
xray_assignment:
  sinkhorn_epsilon: 0.03
  sinkhorn_iterations: 20
  use_feature_queue: false
  queue_size: 0
  queue_start_steps: 0
mri_assignment:
  sinkhorn_epsilon: 0.03
  sinkhorn_iterations: 20
  use_feature_queue: true
  queue_size: 128
  queue_start_steps: 100
xray_swav_loss:
  temperature: 0.1
  num_assignment_crops: 2
mri_swav_loss:
  temperature: 0.1
  num_assignment_crops: 2
schedule:
  warm_start_epochs: 20
  joint_epochs: 46
  cross_modal_ramp_epochs: 10
optimizer:
  lr: 0.000135
  weight_decay: 0.00000426
  betas: [0.9, 0.999]
  eps: 1.0e-08
  grad_clip_norm: 3.0
  min_lr_ratio: 0.11398221678844438
  warmup_epochs: 1
checkpoint:
  output_dir: outputs/radiant/vitb16_scratch/checkpoints
  save_every_epochs: 4
  keep_last_only: false
  resume_path: null
wandb:
  enabled: true
  project: radiant
  run_name: radiant_vitb16_scratch
  group: radiant
  tags: [radiant, vitb16, scratch]
distributed:
  enabled: true
  backend: nccl
lambda_xray_view: 0.12928285900242717
lambda_centroid_alignment: 1.6483936935654193
centroid_alignment:
  normalize_centroids: true
  min_prototype_mass: 0.0001
  distance: mse
lambda_projection_mil_contrastive: 0.034114242602017016
projection_mil_temperature: 0.07
lambda_projection_attention_diversity: 0.031716595870406004
runtime:
  cudnn_enabled: true
  cudnn_benchmark: true
  cudnn_deterministic: false
  allow_cudnn_fallback_on_init_error: true
ablations:
  prototype_scope: anatomy_specific
devices:
  xray: null
  mri: null
  output: null
